name: Cruft update

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "0 4 * * *"   # Daily at 04:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: chore/cruft-update
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.VSHNBOT_TF_MODULE_SSH_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cruft
        run: pip install cruft

      - name: Check for template updates
        id: check
        run: |
          if cruft check; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply update, push over SSH, open PR
        if: steps.check.outputs.outdated == 'true'
        run: |
          set -euo pipefail

          git config user.name  "vshnbot"
          git config user.email "tech+github@vshn.ch"

          git switch -C "$BRANCH"
          cruft update --skip-apply-ask

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after cruft update; nothing to do."
            exit 0
          fi

          git add -A
          git commit -m "chore: sync with module template"
          git push --force-with-lease origin "$BRANCH"

          BASE="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "sync with module template" \
              --label vega-renovate-ops \
              --body "Automated sync from the Terraform module template. Resolve any \`.rej\` conflict files before merging."
          fi
